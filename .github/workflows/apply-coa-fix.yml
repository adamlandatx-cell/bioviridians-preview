name: Apply COA readability fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link COA override stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<link rel="stylesheet" href="coa-fix.css">'
          if tag not in s:
              s = s.replace('</head>', tag + '\n</head>', 1)
              p.write_text(s)
          PY
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply COA readability stylesheet"
          git push
